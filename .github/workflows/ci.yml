name: CI
on: [push, pull_request]
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --json > npm-audit.json || true
      - run: node -e "const a=require('./npm-audit.json'); console.log('npm audit summary:', JSON.stringify(a.metadata && a.metadata.vulnerabilities)); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n, v.severity, 'fix:', JSON.stringify(v.fixAvailable));"
      - run: npm run build
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: test-bridge-otzplugin
          path: dist/*.otzplugin
          if-no-files-found: error
  otzaria-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin-integration
          build: 'true'
          publish: 'false'
