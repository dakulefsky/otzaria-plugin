# Copy into a plugin repository's .github/workflows/validate.yml
name: Validate Otzaria plugin
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate against official Otzaria SDK and packaging rules
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: .
          fail-on-warnings: 'true'
          publish: 'false'
